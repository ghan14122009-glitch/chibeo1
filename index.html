<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2a0a24" />
  <title>Gửi Thuỳ Duyên 💖</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Dancing+Script:wght@600&family=Be+Vietnam+Pro:wght@300;400;600&display=swap&subset=vietnamese"
    rel="stylesheet"
  />

  <style>
    :root {
      --pink: #ff6fae;
      --rose: #ff3d84;
      --gold: #ffd9a8;
      --text: #fff1f6;
      --serif: "Playfair Display", Georgia, serif;
      --script: "Dancing Script", "Segoe Script", cursive;
      --sans: "Be Vietnam Pro", "Segoe UI", Arial, sans-serif;
      box-sizing: border-box;
    }

    *, *::before, *::after {
      box-sizing: inherit;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: radial-gradient(circle at 50% 30%, #4a1240, #2a0a24 70%);
      color: var(--text);
      font-family: var(--sans);
      -webkit-tap-highlight-color: transparent;
    }

    .glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: .35;
      pointer-events: none;
    }

    .g1 {
      width: 50vmax;
      height: 50vmax;
      background: #ff2d8a;
      left: -15vmax;
      top: -10vmax;
    }

    .g2 {
      width: 40vmax;
      height: 40vmax;
      background: #8a3dff;
      right: -12vmax;
      bottom: -10vmax;
    }

    .star {
      position: fixed;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #fff;
      animation: tw 3s infinite alternate;
      pointer-events: none;
    }

    @keyframes tw {
      from { opacity: .1; }
      to {
        opacity: .9;
        box-shadow: 0 0 8px #fff;
      }
    }

    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1rem;
      transition: opacity 1s, transform 1s;
      z-index: 2;
    }

    #stage.hide {
      opacity: 0;
      transform: scale(.92);
      pointer-events: none;
    }

    .line {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      text-align: center;
      font-family: var(--serif);
      font-weight: 900;
      line-height: 1.15;
    }

    .l1 {
      font-size: clamp(1.5rem, 7vw, 4rem);
      color: #fff;
    }

    .l2 {
      font-size: clamp(2.4rem, 11vw, 5.8rem);
      color: var(--pink);
      text-shadow: 0 0 30px var(--rose);
    }

    .slot {
      display: inline-block;
      opacity: 0;
      min-width: .05em;
    }

    .slot.sp {
      min-width: .35em;
    }

    .slot.ok {
      opacity: 1;
      animation: pop .6s;
    }

    @keyframes pop {
      0% {
        transform: scale(1.6);
        filter: brightness(2.5);
      }
      100% {
        transform: none;
        filter: none;
      }
    }

    .fly {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 3;
      pointer-events: none;
      font-family: var(--serif);
      font-weight: 900;
      color: #ffb3d4;
      text-shadow: 0 0 14px var(--rose);
      will-change: transform;
    }

    #hint {
      font-family: var(--script);
      font-size: clamp(1.2rem, 4vw, 1.6rem);
      color: var(--gold);
      animation: pulse 1.6s infinite;
      margin-top: 1rem;
      text-align: center;
    }

    @keyframes pulse {
      50% {
        opacity: .5;
        transform: scale(1.05);
      }
    }

    #btn, .b2 {
      padding: .85rem 2rem;
      border: 0;
      border-radius: 99px;
      font: 600 1rem var(--sans);
      color: #fff;
      cursor: pointer;
      background: linear-gradient(135deg, #ff6fae, #ff3d84);
      box-shadow: 0 0 28px rgba(255, 61, 132, .55);
      transition: transform .2s;
      z-index: 5;
    }

    #btn:hover, .b2:hover {
      transform: scale(1.07);
    }

    #card {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 1rem;
      padding-top: max(1rem, env(safe-area-inset-top));
      padding-bottom: max(1rem, env(safe-area-inset-bottom));
      z-index: 4;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.2s;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    #card.show {
      opacity: 1;
      pointer-events: auto;
    }

    .box {
      position: relative;
      margin: auto;
      max-width: 420px;
      width: 100%;
      text-align: center;
      padding: 1.5rem 1.1rem 1.1rem;
      border-radius: 24px;
      background: linear-gradient(
        160deg,
        rgba(255,255,255,.13),
        rgba(255,255,255,.04)
      );
      border: 1px solid rgba(255,182,213,.4);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow:
        0 25px 90px rgba(255,61,132,.35),
        inset 0 0 40px rgba(255,150,200,.08);
      transform: scale(.85) translateY(30px);
      transition: transform 1.2s cubic-bezier(.2, 1.3, .3, 1);
    }

    #card.show .box {
      transform: none;
    }

    .badge {
      display: inline-block;
      padding: .35rem .8rem;
      border-radius: 99px;
      font-size: .66rem;
      letter-spacing: .1em;
      color: #4a1240;
      font-weight: 600;
      background: linear-gradient(90deg, #ffd9a8, #ffb3d4);
      box-shadow: 0 0 20px rgba(255,217,168,.5);
    }

    .big {
      font-size: 2.1rem;
      margin: .4rem 0 0;
      animation: beat 1.2s infinite;
    }

    @keyframes beat {
      15% { transform: scale(1.25); }
      30% { transform: scale(1); }
      45% { transform: scale(1.18); }
    }

    .t1 {
      font-family: var(--script);
      font-size: 1.35rem;
      color: var(--gold);
      margin: 0;
    }

    .t2 {
      font-family: var(--serif);
      font-size: clamp(1.7rem, 8vw, 2.4rem);
      margin: 0 0 .2rem;
      overflow-wrap: anywhere;
      background: linear-gradient(
        90deg,
        #ff9ec8,
        #fff,
        #ffd9a8,
        #ff6fae,
        #ff9ec8
      );
      background-size: 250% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: sh 5s linear infinite;
    }

    @keyframes sh {
      to { background-position: -250% 0; }
    }

    .orn {
      display: flex;
      align-items: center;
      gap: .6rem;
      justify-content: center;
      color: var(--pink);
      margin: .4rem 0 1rem;
    }

    .orn::before, .orn::after {
      content: "";
      height: 1px;
      width: 22%;
      background: linear-gradient(90deg, transparent, var(--pink));
    }

    .orn::after {
      transform: scaleX(-1);
    }

    #msg {
      font-weight: 300;
      font-size: .9rem;
      line-height: 1.8;
      min-height: 6.4em;
      margin: 0 .3rem;
      overflow-wrap: anywhere;
    }

    .wishes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .45rem;
      margin: .8rem 0;
    }

    .w {
      padding: .6rem .4rem;
      border-radius: 14px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,182,213,.25);
      opacity: 0;
      transform: translateY(20px) scale(.9);
      transition: all .8s cubic-bezier(.2, 1.4, .3, 1);
    }

    .w.on {
      opacity: 1;
      transform: none;
    }

    .w i {
      font-style: normal;
      font-size: 1.2rem;
      display: block;
    }

    .w b {
      display: block;
      font-family: var(--serif);
      font-size: .82rem;
      color: #ffc2dc;
      margin: .2rem 0;
    }

    .w span {
      font-size: .68rem;
      font-weight: 300;
      opacity: .85;
      line-height: 1.5;
      display: block;
    }

    .quote {
      font-family: var(--script);
      font-size: 1.15rem;
      color: var(--gold);
      line-height: 1.6;
      opacity: 0;
      transition: opacity 1.2s;
    }

    .sign {
      font-family: var(--script);
      font-size: 1.2rem;
      color: var(--pink);
      margin: .4rem 0 .3rem;
      opacity: 0;
      transition: opacity 1.2s;
    }

    .on2 {
      opacity: 1;
    }

    .btns {
      display: flex;
      gap: .7rem;
      justify-content: center;
      flex-wrap: wrap;
      opacity: 0;
      transition: opacity 1s;
    }

    .btns small {
      font-size: .7rem;
      opacity: .7;
      letter-spacing: .04em;
      font-weight: 300;
    }

    .heart {
      position: fixed;
      bottom: -50px;
      z-index: 1;
      pointer-events: none;
      animation: up linear forwards;
      filter: drop-shadow(0 0 8px rgba(255,61,132,.7));
    }

    @keyframes up {
      to {
        transform: translate(var(--dx), -115vh) rotate(var(--rot));
        opacity: 0;
      }
    }

    .burst {
      position: fixed;
      z-index: 9;
      pointer-events: none;
      animation: bst .9s ease-out forwards;
    }

    @keyframes bst {
      to {
        transform: translate(var(--bx), var(--by)) scale(.3);
        opacity: 0;
      }
    }

    #cur {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 99;
      pointer-events: none;
      font-size: 26px;
      color: #ff3d84;
      text-shadow: 0 0 12px #ff3d84, 0 0 28px #ff6fae;
      opacity: 0;
      transition: opacity .3s;
    }

    #cur span {
      display: inline-block;
      animation: beat 1.2s infinite;
    }

    .trail {
      position: fixed;
      z-index: 98;
      pointer-events: none;
      color: #ff6fae;
      transform: translate(-50%, -50%);
      animation: tr 1.1s ease-out forwards;
      text-shadow: 0 0 8px rgba(255,61,132,.8);
    }

    @keyframes tr {
      to {
        transform: translate(calc(-50% + var(--tx)), -90px) scale(.4);
        opacity: 0;
      }
    }

    @media (pointer: fine) {
      body { cursor: none; }
      body * { cursor: none !important; }
    }

    @media (pointer: coarse) {
      #cur, .trail { display: none; }
    }

    @media (max-width: 360px) {
      .box {
        padding: 1.2rem .8rem .9rem;
      }

      .wishes {
        gap: .35rem;
      }

      .w span {
        font-size: .64rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <div class="glow g1"></div>
  <div class="glow g2"></div>

  <div id="stage">
    <div class="line l1" id="l1"></div>
    <div class="line l2" id="l2"></div>
    <div id="hint">✦ Có một thông điệp đang bay lạc... ✦</div>
    <button id="btn">Giải mã 💌</button>
  </div>

  <div id="card">
    <div class="box">
      <span class="badge">20 · 10 &nbsp; Ngày Phụ nữ Việt Nam</span>
      <div class="big">💖</div>
      <p class="t1">Gửi riêng cho</p>
      <h1 class="t2" id="name"></h1>
      <div class="orn">❀ ❤ ❀</div>
      <div id="msg"></div>
      <div class="wishes" id="wishes"></div>
      <div class="quote" id="quote"></div>
      <div class="sign" id="sign"></div>
      <div class="btns" id="btns">
        <small>Nhấn phím Space để thả thêm tim ♡</small>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // CẤU HÌNH LỜI CHÚC DÀNH RIÊNG CHO THUỲ DUYÊN
    // ==========================================

    const CFG = {
      l1: "CHÚC MỪNG 20/10",
      l2: "THUỲ DUYÊN",
      name: "Thuỳ Duyên",

      intro:
        "Nhân ngày 20/10, chúc Thuỳ Duyên luôn xinh đẹp, rạng rỡ như đóa hồng đầu mùa. Mong mỗi ngày của bạn đều ngập tràn tiếng cười, bình yên và thật nhiều yêu thương. Chúc bạn luôn tự tin, vui vẻ và gặp được những điều thật tuyệt vời trong cuộc sống. 🌸",

      wishes: [
        ["🌸", "Luôn xinh đẹp", "Rạng rỡ từ nụ cười đến trái tim."],
        ["💖", "Thật hạnh phúc", "Mỗi ngày đều có một niềm vui nhỏ."],
        ["✨", "Luôn bình yên", "Nhẹ nhàng giữa mọi bộn bề."],
        ["🌹", "Được yêu thương", "Nhiều hơn bạn có thể đếm hết."]
      ],

      quote:
        "Mong rằng những điều dịu dàng nhất sẽ luôn tìm đến Duyên, như cách những bông hoa tìm về phía ánh mặt trời.",

      sign: "— Chúc Duyên một ngày 20/10 thật đặc biệt 🌹"
    };

    const POOL = "ABCDEFGHIKLMNOPQRSTUVXYĂÂÊÔƠƯ0123456789";

    const rnd = (a) =>
      Array.isArray(a) || typeof a === "string"
        ? a[Math.floor(Math.random() * a.length)]
        : 0;

    const R = (a, b) => Math.random() * (b - a) + a;
    const $ = (id) => document.getElementById(id);

    // Tạo bầu trời sao
    for (let i = 0; i < 60; i++) {
      const s = document.createElement("div");
      s.className = "star";
      s.style.cssText =
        `left:${R(0, 100)}vw;top:${R(0, 100)}vh;animation-delay:${R(0, 3)}s`;
      document.body.appendChild(s);
    }

    // Hiển thị nội dung thiệp
    $("name").textContent = CFG.name;
    $("sign").textContent = CFG.sign;
    $("quote").textContent = CFG.quote;

    CFG.wishes.forEach((w) => {
      const item = document.createElement("div");
      item.className = "w";

      const icon = document.createElement("i");
      icon.textContent = w[0];

      const title = document.createElement("b");
      title.textContent = w[1];

      const description = document.createElement("span");
      description.textContent = w[2];

      item.append(icon, title, description);
      $("wishes").appendChild(item);
    });

    // ==========================================
    // HIỆU ỨNG CHỮ BAY VÀ GIẢI MÃ
    // ==========================================

    const flyers = [];

    let W = innerWidth;
    let H = innerHeight;
    let decoding = false;
    let landed = 0;
    let total = 0;
    let animationStarted = false;
    let cardShown = false;

    function build(el, text, cls) {
      [...text].forEach((c) => {
        const s = document.createElement("span");

        s.className = "slot" + (c === " " ? " sp" : "");
        s.textContent = c === " " ? "\u00a0" : c;
        el.appendChild(s);

        if (c !== " ") {
          flyers.push({
            slot: s,
            c,
            cls,
            real: true
          });
        }
      });
    }

    build($("l1"), CFG.l1, "l1");
    build($("l2"), CFG.l2, "l2");

    total = flyers.length;

    function mk(f, size) {
      const e = document.createElement("div");

      e.className = "fly";
      e.style.fontSize = size + "px";
      e.style.opacity = f.real ? 1 : .55;
      e.style.color = rnd([
        "#ffb3d4",
        "#ff6fae",
        "#ffd9a8",
        "#e0b3ff",
        "#ffffff"
      ]);

      e.textContent = rnd(POOL);
      document.body.appendChild(e);

      Object.assign(f, {
        el: e,
        x: R(0, W),
        y: R(0, H),
        vx: R(-2.6, 2.6),
        vy: R(-2.6, 2.6),
        rot: R(0, 360),
        vr: R(-4, 4),
        t: R(0, 6),
        sc: 1,
        state: "fly"
      });
    }

    function init() {
      if (animationStarted) return;
      animationStarted = true;

      flyers.forEach((f) => {
        mk(f, parseFloat(getComputedStyle(f.slot).fontSize));
      });

      // Các ký tự gây nhiễu
      for (let i = 0; i < 34; i++) {
        const f = {
          real: false,
          c: "",
          cls: ""
        };

        flyers.push(f);
        mk(f, R(18, 56));
      }

      requestAnimationFrame(tick);
    }

    function tick() {
      flyers.forEach((f) => {
        if (f.state === "done" || !f.el) return;

        if (f.state === "fly") {
          f.vx += R(-.12, .12);
          f.vy += R(-.12, .12);

          const m = Math.hypot(f.vx, f.vy);
          const mx = 3.2;

          if (m > mx) {
            f.vx *= mx / m;
            f.vy *= mx / m;
          }

          f.x += f.vx;
          f.y += f.vy;
          f.rot += f.vr;
          f.t += .04;
          f.sc = 1 + Math.sin(f.t) * .35;

          if (f.x < 0 || f.x > W) f.vx *= -1;
          if (f.y < 0 || f.y > H) f.vy *= -1;

          f.x = Math.max(-10, Math.min(W + 10, f.x));
          f.y = Math.max(-10, Math.min(H + 10, f.y));
        } else if (f.state === "go") {
          const k = .075;

          f.x += (f.tx - f.x) * k;
          f.y += (f.ty - f.y) * k;
          f.rot += (0 - f.rot) * k;
          f.sc += (1 - f.sc) * k;

          if (
            Math.hypot(f.tx - f.x, f.ty - f.y) < 1.2 &&
            Math.abs(f.rot) < 1
          ) {
            land(f);
          }
        }

        if (f.el) {
          f.el.style.transform =
            `translate(${f.x}px,${f.y}px) translate(-50%,-50%) rotate(${f.rot}deg) scale(${f.sc})`;
        }
      });

      requestAnimationFrame(tick);
    }

    function land(f) {
      if (f.state === "done") return;

      f.state = "done";

      if (f.el) f.el.remove();

      if (f.slot) {
        f.slot.classList.add("ok");
        sparkle(f.slot);
      }

      landed++;

      if (landed === total) {
        $("hint").textContent = "Giải mã thành công 💖";
        heartStorm();

        setTimeout(showCard, 1800);
      }
    }

    // Các ký tự gây nhiễu thay đổi liên tục
    setInterval(() => {
      flyers.forEach((f) => {
        if (
          f.el &&
          f.state !== "done" &&
          Math.random() < .4
        ) {
          f.el.textContent = rnd(POOL);
        }
      });
    }, 150);

    function decode() {
      if (decoding) return;

      decoding = true;
      $("btn").style.display = "none";
      $("hint").textContent = "Các chữ cái đang tìm về nhau... ✨";

      let i = 0;

      flyers.forEach((f) => {
        if (f.real) {
          setTimeout(() => {
            if (!f.el || !f.slot) return;

            const r = f.slot.getBoundingClientRect();

            f.tx = r.left + r.width / 2;
            f.ty = r.top + r.height / 2;

            f.rot = (((f.rot % 360) + 540) % 360) - 180;
            f.state = "go";
            f.el.textContent = f.c;
          }, 600 + i++ * 160);
        } else {
          setTimeout(() => {
            if (f.el) f.el.style.opacity = 0;
          }, 500 + R(0, 1500));

          setTimeout(() => {
            f.state = "done";
            if (f.el) f.el.remove();
          }, 2600);
        }
      });
    }

    $("btn").addEventListener("click", decode);

    $("stage").addEventListener("click", (e) => {
      if (e.target.id !== "btn") decode();
    });

    addEventListener("resize", () => {
      W = innerWidth;
      H = innerHeight;
    });

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(init);
    } else {
      init();
    }

    // ==========================================
    // HIỆU ỨNG LẤP LÁNH VÀ TRÁI TIM
    // ==========================================

    function sparkle(el) {
      const r = el.getBoundingClientRect();

      for (let i = 0; i < 4; i++) {
        burst(
          r.left + r.width / 2,
          r.top + r.height / 2,
          "✦",
          10
        );
      }
    }

    function burst(x, y, ch, size) {
      const b = document.createElement("div");

      b.className = "burst";
      b.textContent = ch;

      b.style.cssText +=
        `left:${x}px;top:${y}px;font-size:${size + R(0, 10)}px;color:#ffc2dc;--bx:${R(-70, 70)}px;--by:${R(-70, 70)}px`;

      document.body.appendChild(b);

      setTimeout(() => b.remove(), 900);
    }

    const HEARTS = [
      "❤", "💖", "💗", "💕",
      "💘", "🌸", "🌹", "💝"
    ];

    function heart() {
      const h = document.createElement("div");

      h.className = "heart";
      h.textContent = rnd(HEARTS);

      const d = R(5, 11);

      h.style.cssText +=
        `left:${R(0, 100)}vw;font-size:${R(16, 44)}px;animation-duration:${d}s;--dx:${R(-80, 80)}px;--rot:${R(-40, 40)}deg;opacity:${R(.6, 1)}`;

      document.body.appendChild(h);

      setTimeout(() => h.remove(), d * 1000);
    }

    function heartStorm() {
      for (let i = 0; i < 40; i++) {
        setTimeout(heart, i * 60);
      }
    }

    // ==========================================
    // HIỆN THIỆP CHÚC MỪNG
    // ==========================================

    function showCard() {
      if (cardShown) return;
      cardShown = true;

      $("stage").classList.add("hide");
      $("card").classList.add("show");

      setInterval(heart, 280);
      heartStorm();

      let i = 0;

      setTimeout(function type() {
        $("msg").textContent = CFG.intro.slice(0, ++i);

        if (i < CFG.intro.length) {
          setTimeout(type, 40);
        } else {
          document.querySelectorAll(".w").forEach((w, k) => {
            setTimeout(() => w.classList.add("on"), k * 350);
          });

          setTimeout(() => {
            $("quote").classList.add("on2");
          }, 1700);

          setTimeout(() => {
            $("sign").classList.add("on2");
          }, 2500);

          setTimeout(() => {
            $("btns").style.opacity = 1;
          }, 3000);
        }
      }, 1200);
    }

    // Nhấn Space để giải mã hoặc thả thêm tim
    addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        if (
          e.target instanceof HTMLInputElement ||
          e.target instanceof HTMLTextAreaElement
        ) {
          return;
        }

        e.preventDefault();

        if (!decoding) {
          decode();
        } else {
          heartStorm();
        }
      }
    });

    // Con trỏ trái tim trên máy tính
    const cur = document.createElement("div");

    cur.id = "cur";
    cur.innerHTML = "<span>❤</span>";
    document.body.appendChild(cur);

    let lt = 0;

    addEventListener("pointermove", (e) => {
      if (e.pointerType === "touch") return;

      cur.style.transform =
        `translate(${e.clientX}px,${e.clientY}px) translate(-50%,-50%)`;

      cur.style.opacity = 1;

      const n = performance.now();

      if (n - lt < 50) return;
      lt = n;

      const t = document.createElement("div");

      t.className = "trail";
      t.textContent = rnd(["❤", "💖", "💗", "💕"]);

      t.style.cssText +=
        `left:${e.clientX}px;top:${e.clientY}px;font-size:${R(10, 20)}px;--tx:${R(-30, 30)}px`;

      document.body.appendChild(t);

      setTimeout(() => t.remove(), 1100);
    });

    document.addEventListener("mouseleave", () => {
      cur.style.opacity = 0;
    });

    // Chạm vào thiệp để tạo hiệu ứng trái tim
    $("card").addEventListener("click", (e) => {
      if (e.target.tagName !== "BUTTON") {
        for (let i = 0; i < 6; i++) {
          burst(
            e.clientX,
            e.clientY,
            rnd(HEARTS),
            18
          );
        }
      }
    });
  </script>
</body>
